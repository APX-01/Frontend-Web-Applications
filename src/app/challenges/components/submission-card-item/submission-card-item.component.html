<mat-card class="submission-card">

    <!-- Imagen principal -->
    <div class="image-wrapper">
        <img mat-card-image [src]="submission.imageUrl" alt="Challenge image" />
    </div>

    <mat-card-content>

        <mat-card-header class="custom-header" style="text-align: center">
            Submission #{{ submission.id }}
        </mat-card-header>

        <span style="text-align: center"><strong>Student:</strong> {{ student.firstName }} {{student.lastName}}</span>

        <span style="text-align: center">
            <strong>Score:</strong>
            @if (submission.status == "NOT_GRADED") {
                <span class="not-graded">Not graded yet</span>
            } @else {
                <span [class.red-score]="submission.score <= 12"
                      [class.green-score]="submission.score > 12">
                    {{submission.score}}
                </span>
            }
        </span>

    </mat-card-content>

    <mat-card-footer>
        <button *ngIf="currentUser.roles[0] === 'ROLE_TEACHER'" mat-button (click)="editSubmission()">Set Score</button>
    </mat-card-footer>

</mat-card>
