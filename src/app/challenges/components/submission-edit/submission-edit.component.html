<form [formGroup]="submissionForm" (ngSubmit)="onSubmit()">

    @if (student) {
        <p>🎓 Estudiante: {{student.firstName}} {{student.lastName}}</p>
    }

    <div style="height: 10px"></div>
    <div class="submission-content-title">
        📄 Contenido:
    </div>
    <div class="submission-content">
        <p>{{data.content}}</p>
    </div>




    <mat-form-field appearance="fill">
        <mat-label>⭐ Puntaje</mat-label>
        <input matInput formControlName="score" type="number" min="0" max="20"/>
        <mat-error *ngIf="submissionForm.get('score')?.hasError('max')">
            El valor no puede ser mayor a 20 ni menor a 0
        </mat-error>
    </mat-form-field>


    <div class="button-group">
        <button mat-raised-button color="primary" type="submit">✅ Guardar</button>
        <button mat-button color="warn" type="button" (click)="onCancel()">❌ Cancelar</button>
    </div>

</form>
